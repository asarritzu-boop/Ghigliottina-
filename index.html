<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER BUILD</title>
    
    <meta property="og:title" content="CYBER BUILD">
    <meta property="og:description" content="Costruisci il personaggio indovinando gli indizi corretti.">
    <meta property="og:image" content="https://asarritzu-boop.github.io/Ghigliottina-/icona.png">
    <meta property="og:url" content="https://asarritzu-boop.github.io/Ghigliottina-/">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" href="https://asarritzu-boop.github.io/Ghigliottina-/icona.png">
    <meta name="theme-color" content="#050b1a" id="meta-theme-color">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- CONFIGURAZIONE VARIABILI --- */
        :root {
            --bg-color: #0f172a; 
            --bg-gradient: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            --text-color: #ffffff;
            --primary: #38bdf8; 
            --secondary: #f43f5e; 
            --panel-bg: rgba(255, 255, 255, 0.03);
            --btn-transparent: rgba(255, 255, 255, 0.01);
            --input-bg: #ffffff; /* Sfondo opaco per input */
            --input-text: #000000;
            --font-main: 'Quicksand', sans-serif;
            --radius: 24px;
        }

        /* --- TEMI AGGIORNATI (3 SCURI + 2 CHIARI) --- */
        /* Tema 1: Aurora (Scuro) */
        body.theme-1 { --bg-color: #022c22; --primary: #2dd4bf; --secondary: #a855f7; --text-color: #ffffff; --panel-bg: rgba(255,255,255,0.05); } 
        /* Tema 2: Sunset (Scuro) */
        body.theme-2 { --bg-color: #4c0519; --primary: #fb7185; --secondary: #fbbf24; --text-color: #ffffff; --panel-bg: rgba(255,255,255,0.05); } 
        /* Tema 3: Cloud (CHIARO) */
        body.theme-3 { --bg-color: #f0f9ff; --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); --primary: #0284c7; --secondary: #e11d48; --text-color: #0f172a; --panel-bg: rgba(0,0,0,0.05); --btn-transparent: rgba(0,0,0,0.05); } 
        /* Tema 4: Lemon (CHIARO) */
        body.theme-4 { --bg-color: #fefce8; --bg-gradient: linear-gradient(135deg, #fefce8 0%, #fef9c3 100%); --primary: #854d0e; --secondary: #dc2626; --text-color: #422006; --panel-bg: rgba(0,0,0,0.05); --btn-transparent: rgba(0,0,0,0.05); } 
        /* Tema 5: Deep Space (Scuro) */
        body.theme-5 { --bg-color: #050b1a; --primary: #00f0ff; --secondary: #ff0055; --text-color: #ffffff; --panel-bg: rgba(255,255,255,0.03); } 

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
            transition: all 0.5s ease;
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
        }

        /* --- UI COMPONENTS --- */
        .btn-modern {
            background: var(--btn-transparent);
            backdrop-filter: blur(10px);
            border: 2px solid var(--primary);
            border-radius: var(--radius);
            padding: 15px 40px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-color);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .btn-modern:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 25px var(--primary);
            transform: translateY(-3px);
        }

        /* Pulsante conferma opaco */
        .btn-confirm {
            background: var(--primary) !important;
            color: #ffffff !important;
            border: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .btn-small { padding: 10px 20px; font-size: 0.85rem; border-width: 1px; }

        .screen {
            display: none; width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
            flex-direction: column; z-index: 10;
        }
        .screen.active { display: flex; }

        #home-screen {
            justify-content: flex-start;
            align-items: center;
            text-align: center;
            padding-top: 15vh;
        }

        h1 {
            font-weight: 700; font-size: 3.5rem;
            margin-bottom: 5px;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }
        .subtitle { font-size: 1.2rem; opacity: 0.9; margin-bottom: 40px; font-weight: 400; }

        .footer-nav {
            position: absolute; bottom: 40px;
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%;
        }

        #game-screen { flex-direction: row; }

        .side-panel {
            width: 32%; height: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0,0,0,0.05);
            display: flex; flex-direction: column; padding: 20px; overflow-y: auto;
        }
        #left-panel { border-right: 2px solid var(--primary); }
        #right-panel { border-left: 2px solid var(--secondary); }

        .panel-header {
            font-weight: 700; color: var(--primary); font-size: 1.3rem;
            margin-bottom: 25px; text-transform: uppercase;
        }

        .clue-item {
            margin-bottom: 12px; padding: 12px 18px;
            border-radius: 15px; font-weight: 600;
            background: rgba(255,255,255,0.1);
            border: 1px solid transparent; width: 100%;
        }
        .clue-correct { border-color: #10b981; color: #10b981; background: rgba(16,185,129,0.05); }
        .clue-wrong { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.05); }

        #center-area {
            flex: 1; display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            padding: 30px 10px;
        }

        .clue-buttons-wrapper {
            display: flex; gap: 20px; width: 95%; justify-content: center;
        }

        .game-btn {
            width: 48%; height: 180px;
            border-radius: var(--radius);
            background: var(--btn-transparent) !important;
            backdrop-filter: blur(15px);
            border: 2px solid var(--primary);
            color: var(--text-color);
            font-weight: 700; font-size: 1.4rem;
            display: flex; justify-content: center; align-items: center;
            text-align: center; cursor: pointer;
            transition: all 0.3s ease; padding: 15px;
        }

        .game-btn.success { border-color: #10b981; box-shadow: 0 0 30px rgba(16,185,129,0.3); color: #10b981; }
        .game-btn.error { border-color: #ef4444; box-shadow: 0 0 30px rgba(239,68,68,0.3); color: #ef4444; }

        #timer-text { font-weight: 700; font-size: 4.5rem; color: var(--secondary); margin-bottom: 15px; }
        
        /* INPUT SOLUZIONE OPACO */
        input[type="text"] {
            background: var(--input-bg);
            border: 3px solid var(--primary);
            border-radius: var(--radius);
            padding: 18px; width: 100%;
            color: var(--input-text); 
            font-family: var(--font-main);
            font-size: 1.4rem; text-align: center; outline: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .game-footer-bar { display: flex; gap: 15px; margin-bottom: 5px; }

        @keyframes shake { 
            0% { transform: translate(0,0); } 25% { transform: translate(6px,6px); } 
            50% { transform: translate(-6px,-6px); } 75% { transform: translate(6px,-6px); } 100% { transform: translate(-6px,6px); } 
        }
        .shake { animation: shake 0.5s infinite; }

        #result-screen { background: rgba(0,0,0,0.95); backdrop-filter: blur(30px); align-items: center; padding: 40px; }
        .win-text { color: #10b981; font-size: 3.5rem; font-weight: 700; }
        .lose-text { color: #ef4444; font-size: 3.5rem; font-weight: 700; }

        @media (orientation: portrait) {
            #game-screen { flex-direction: column; }
            .side-panel { position: absolute; width: 50%; height: 100%; z-index: 1; padding-top: 100px; }
            #left-panel { left: 0; background: linear-gradient(90deg, var(--bg-color), transparent); }
            #right-panel { right: 0; background: linear-gradient(-90deg, var(--bg-color), transparent); }
            #center-area { z-index: 5; }
            .game-btn { width: 85%; height: 110px; background: rgba(255,255,255,0.1) !important; }
        }
    </style>
</head>
<body>
    <div id="home-screen" class="screen active">
        <h1>CYBER BUILD</h1>
        <div class="subtitle">COSTRUISCI IL PERSONAGGIO</div>
        
        <button class="btn-modern" onclick="startGame()" style="font-size: 1.6rem; padding: 22px 70px;">GIOCA</button>

        <div class="footer-nav">
            <button class="btn-modern btn-small" onclick="shareApp()">Condividi</button>
            <button class="btn-modern btn-small" onclick="window.open('https://asarritzu-boop.github.io/Ghigliottina-/CyberBuild.apk/')">Scarica APK</button>
            <button class="btn-modern btn-small" onclick="changeTheme()">Tema</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="left-panel" class="side-panel">
            <div class="panel-header">CORRETTI</div>
            <div id="left-list"></div>
        </div>

        <div id="center-area">
            <div id="phase-clues" style="display:flex; flex-direction:column; align-items:center; width:100%;">
                <div class="clue-buttons-wrapper">
                    <div id="btn-left" class="game-btn" onclick="handleInput('left')"></div>
                    <div id="btn-right" class="game-btn" onclick="handleInput('right')"></div>
                </div>
            </div>

            <div id="input-phase" style="display:none; flex-direction:column; align-items:center; width:85%;">
                <div id="timer-text">60</div>
                <input type="text" id="answer-input" placeholder="CHI È IL SOGGETTO?">
                <button class="btn-modern btn-confirm" style="margin-top:20px" onclick="checkAnswer()">CONFERMA</button>
            </div>

            <div class="game-footer-bar">
                <button class="btn-modern btn-small" onclick="toggleInstructions()">ISTRUZIONI</button>
                <button class="btn-modern btn-small" style="border-color: var(--secondary)" onclick="quitGame()">ABBANDONA</button>
            </div>
        </div>

        <div id="right-panel" class="side-panel">
            <div class="panel-header">ERRATI</div>
            <div id="right-list"></div>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <div style="text-align:center; max-width:600px;">
            <h2 id="res-title"></h2>
            <p style="font-size:1.4rem; color:#fff;">Il soggetto: <strong id="res-subject" style="color:var(--primary)"></strong></p>
            <div id="res-list" style="margin: 25px 0; text-align:left; border-top:1px solid #333; color:#fff;"></div>
            <button class="btn-modern" onclick="goHome()">TORNA ALLA HOME</button>
        </div>
    </div>

    <div id="modal-overlay" onclick="toggleInstructions()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100; justify-content:center; align-items:center;">
        <div class="modal-box" style="background:var(--bg-color); border:2px solid var(--primary); border-radius:30px; padding:35px; max-width:450px;" onclick="event.stopPropagation()">
            <h3 style="color:var(--primary); margin-top:0;">GUIDA AL GIOCO</h3>
            <p style="color:var(--text-color)">• Seleziona l'indizio corretto tra i due.<br>• Gli indizi corretti vanno a sinistra, gli altri a destra.<br>• Alla fine, scrivi il nome del personaggio entro 60 secondi.</p>
            <button class="btn-modern btn-small" onclick="toggleInstructions()">CHIUDI</button>
        </div>
    </div>
        <script>
        const jsonUrl = 'https://asarritzu-boop.github.io/Ghigliottina-/soggetti.json';
        const testSubject = {
            nome: "BATMAN",
            indizi: [
                { corretto: "PIPISTRELLO", errato: "RAGNO", spiegazione: "È il suo simbolo notturno." },
                { corretto: "GOTHAM", errato: "METROPOLIS", spiegazione: "La città che protegge." },
                { corretto: "MANTELLO", errato: "ARCO", spiegazione: "Parte iconica del suo costume." },
                { corretto: "MILIONARIO", errato: "ALIENO", spiegazione: "Bruce Wayne è ricchissimo." },
                { corretto: "JOKER", errato: "LEX LUTHOR", spiegazione: "Il suo nemico giurato." }
            ]
        };

        let gameState = { subject: null, round: 0, timer: null, shaking: false };

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e=>{});
            else if (document.exitFullscreen) document.exitFullscreen();
        }
        document.addEventListener('keydown', e => { if(e.code==='Space') toggleFullScreen(); });
        let lastTap = 0;
        document.addEventListener('touchend', e => {
            const now = Date.now();
            if (now - lastTap < 400) toggleFullScreen();
            lastTap = now;
        });

        let thmIdx = 1;
        function changeTheme() {
            document.body.classList.remove(`theme-${thmIdx}`);
            thmIdx = (thmIdx % 5) + 1;
            document.body.classList.add(`theme-${thmIdx}`);
            const newColor = getComputedStyle(document.body).getPropertyValue('--bg-color').trim();
            document.getElementById('meta-theme-color').setAttribute('content', newColor);
        }

        function shareApp() {
            const data = { title: 'CYBER BUILD', url: 'https://asarritzu-boop.github.io/Ghigliottina-/' };
            if (navigator.share) navigator.share(data); else alert("Link copiato!");
        }

        async function startGame() {
            gameState.round = 0;
            document.getElementById('left-list').innerHTML = '';
            document.getElementById('right-list').innerHTML = '';
            document.getElementById('phase-clues').style.display = 'flex';
            document.getElementById('input-phase').style.display = 'none';
            try {
                const res = await fetch(jsonUrl);
                const data = await res.json();
                gameState.subject = data[Math.floor(Math.random() * data.length)];
            } catch(e) { gameState.subject = testSubject; }
            switchScreen('game-screen'); loadRound();
        }

        function loadRound() {
            if(gameState.round >= 5) { startEndPhase(); return; }
            const data = gameState.subject.indizi[gameState.round];
            const btnL = document.getElementById('btn-left');
            const btnR = document.getElementById('btn-right');
            btnL.className = btnR.className = 'game-btn';
            const isLeftCorrect = Math.random() < 0.5;
            if(isLeftCorrect) { setupBtn(btnL, data.corretto, 'correct'); setupBtn(btnR, data.errato, 'wrong'); }
            else { setupBtn(btnL, data.errato, 'wrong'); setupBtn(btnR, data.corretto, 'correct'); }
        }

        function setupBtn(el, txt, status) { el.innerText = txt; el.dataset.status = status; el.style.pointerEvents = 'auto'; }

        function handleInput(side) {
            if(gameState.shaking) return;
            gameState.shaking = true;
            const clicked = document.getElementById(`btn-${side}`);
            const other = document.getElementById(side==='left'?'btn-right':'btn-left');
            document.body.classList.add('shake');
            setTimeout(() => {
                document.body.classList.remove('shake'); gameState.shaking = false;
                if(clicked.dataset.status === 'correct') clicked.classList.add('success');
                else { clicked.classList.add('error'); other.classList.add('success'); }
                setTimeout(() => { transferToPanels(clicked, other); gameState.round++; loadRound(); }, 800);
            }, 3000);
        }

        function transferToPanels(clicked, other) {
            const c = clicked.dataset.status === 'correct' ? clicked : other;
            const w = clicked.dataset.status === 'wrong' ? clicked : other;
            addPanelItem('left-list', c.innerText, true, clicked === c);
            addPanelItem('right-list', w.innerText, false, clicked === w);
        }

        function addPanelItem(id, txt, isC, isSel) {
            const div = document.createElement('div');
            div.className = `clue-item ${isC ? 'clue-correct' : 'clue-wrong'}`;
            div.innerText = txt;
            if(isSel) div.style.borderWidth = '3px';
            document.getElementById(id).appendChild(div);
        }

        function startEndPhase() {
            document.getElementById('phase-clues').style.display = 'none';
            document.getElementById('input-phase').style.display = 'flex';
            let t = 60; document.getElementById('timer-text').innerText = t;
            gameState.timer = setInterval(() => { t--; document.getElementById('timer-text').innerText = t; if(t <= 0) finalize(false); }, 1000);
        }

        function checkAnswer() {
            const val = document.getElementById('answer-input').value.trim().toUpperCase();
            finalize(val === gameState.subject.nome.toUpperCase());
        }

        function finalize(win) {
            clearInterval(gameState.timer); switchScreen('result-screen');
            const t = document.getElementById('res-title');
            t.innerText = win ? "VITTORIA!" : "HAI PERSO";
            t.className = win ? "win-text" : "lose-text";
            document.getElementById('res-subject').innerText = gameState.subject.nome;
            const list = document.getElementById('res-list'); list.innerHTML = '';
            gameState.subject.indizi.forEach(i => {
                list.innerHTML += `<div style="padding:10px 0; border-bottom:1px solid #333;"><strong>${i.corretto}</strong>: ${i.spiegazione}</div>`;
            });
        }

        function switchScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function toggleInstructions() { const m = document.getElementById('modal-overlay'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; }
        function quitGame() { if(confirm("Abbandonare?")) { clearInterval(gameState.timer); goHome(); } }
        function goHome() { switchScreen('home-screen'); }
    </script>
</body>
</html>
