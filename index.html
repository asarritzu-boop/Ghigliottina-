<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Loading Area</title>
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00f2ff;
            --dark-bg: #0d0d0d;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* Effetto sfondo a griglia */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Testo Principale Neon */
        .loading-text {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink),
                0 0 80px var(--neon-pink);
            animation: flicker 2s infinite alternate;
            margin-bottom: 50px;
            letter-spacing: 5px;
        }

        /* Pulsante Cyberpunk */
        .btn-cyber {
            position: relative;
            padding: 20px 40px;
            font-size: 1.2rem;
            color: var(--neon-blue);
            text-decoration: none;
            border: 2px solid var(--neon-blue);
            background: transparent;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .btn-cyber:hover {
            background: var(--neon-blue);
            color: var(--dark-bg);
            box-shadow: 0 0 50px var(--neon-blue);
        }

        /* Animazioni */
        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                text-shadow: 
                    0 0 5px #fff,
                    0 0 10px #fff,
                    0 0 20px var(--neon-pink),
                    0 0 40px var(--neon-pink);
            }
            20%, 24%, 55% {       
                text-shadow: none;
                color: #444;
            }
        }

        /* Elemento decorativo rotante */
        .scanner {
            width: 100%;
            height: 5px;
            background: var(--neon-blue);
            position: absolute;
            top: 0;
            box-shadow: 0 0 15px var(--neon-blue);
            animation: scan 4s linear infinite;
            opacity: 0.5;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>

    <div class="scanner"></div>

    <div class="loading-text">
        ATTENDI...<br>
        IL GIOCO ARRIVERÀ PRESTO
    </div>

    <a href="https://asarritzu-boop.github.io/PuzzleNGames-/" class="btn-cyber">
        PROVA GLI ALTRI GIOCHI QUI
    </a>

</body>
</html>
